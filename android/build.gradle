// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"


subprojects {
    // NOTE: Do not use afterEvaluate here. Newer Gradle versions can throw:
    // "Cannot run Project.afterEvaluate when the project is already evaluated."
    plugins.withId('com.android.application') {
        project.android { compileSdk 36 }
        tasks.configureEach { t ->
            if (t.name == 'androidSourcesJar') {
                try {
                    if (t.hasProperty('classifier')) {
                        t.classifier = null
                    }
                } catch (e) {
                    // ignore
                }
            }
        }
    }
    plugins.withId('com.android.library') {
        project.android { compileSdk 36 }
        tasks.configureEach { t ->
            if (t.name == 'androidSourcesJar') {
                try {
                    if (t.hasProperty('classifier')) {
                        t.classifier = null
                    }
                } catch (e) {
                    // ignore
                }
            }
        }
    }
}
